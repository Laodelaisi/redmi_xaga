name: Build xaga boot.img

# ============================================================================
# 红米 Note 11T Pro (xaga) boot.img 构建
# ============================================================================
#
# 产出：boot.img —— 主线内核 + 自编 initramfs
# 最终发布到 GitHub Release 永久资源。
#
# ----------------------------------------------------------------------------
# 触发方式
# ----------------------------------------------------------------------------
#   1. 手动触发（Actions 页面 → "Run workflow"）
#      所有参数均有默认值，直接点 Run 即可跑通全流程。
#   2. push tag
#      - boot-v*  → 本工作流
#
# ----------------------------------------------------------------------------
# 说明
# ----------------------------------------------------------------------------
#   - boot.img 内含主线内核与 initramfs，**不含根文件系统**。
#     根文件系统（Arch / pmOS / Ubuntu 等）需自行准备并刷入 userdata。
#   - 默认内核分支 7.2-mt6895-xiaomi-xaga。
#   - 6+128 机型无需特殊参数调整，默认值即适用。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      # ============ 内核相关 ============
      kernel_branch:
        description: |
          [内核] 要编译的分支名（下拉选择）
          - 7.2-mt6895-xiaomi-xaga  : 7.2 内核，功能最新，推荐
          - 6.18-mt6895-xiaomi-xaga : 6.18 LTS 内核，更保守
          注意：分支必须存在于下面的 kernel_repo 中，写错会在
          "Merge kernel config" 步骤因找不到 xaga.config 而报错。
        required: true
        default: '7.2-mt6895-xiaomi-xaga'
        type: choice
        options:
          - '7.2-mt6895-xiaomi-xaga'
          - '6.18-mt6895-xiaomi-xaga'
      kernel_repo:
        description: |
          [内核] 内核源码仓库地址（git clone 用）
          默认是 MT6895-Mainline 官方仓库；若你 fork 过并改了配置，
          填你自己的地址即可（需为公开仓库，无需鉴权）。
        required: true
        default: 'https://github.com/MT6895-Mainline/linux.git'
        type: string
      boot_partition:
        description: |
          [内核] initramfs 里要找的 boot / rootfs 分区路径
          指的是「内核启动后，系统所在分区在 Linux 下的设备节点」，
          不是 fastboot 里的分区名，也不是 userdata 这个名字本身。
          xaga 上 userdata 在 Linux 下枚举为 /dev/sdc86，默认值即此。
          除非你改过分区表（GUID），否则不要动。
        required: true
        default: '/dev/sdc86'
        type: string
      nvdata_partition:
        description: |
          [内核] initramfs 里要找的 nvdata 分区路径
          nvdata 存放 WiFi/BT 的 MAC 地址等校准数据，主线系统需要
          在启动早期读取它。xaga 上枚举为 /dev/sdc13。
          同样：除非改过分区表，否则不要动。
        required: true
        default: '/dev/sdc13'
        type: string

      # ============ 发布 ============
      compress_artifacts:
        description: |
          是否压缩产物后再上传（强烈建议开启，能省 8~10 倍下载流量）
          - ✅ 勾选 : 生成 boot.img.gz，原始 .img 不上传
          - ⬜ 不勾 : 上传原始 .img
          实测 boot.img 压完约几十 MB。
          单文件超过 2GB 会被自动分卷成 .gz.part-aa / .gz.part-ab ...
        required: true
        default: true
        type: boolean
      create_release:
        description: |
          是否创建 GitHub Release（永久资源，不会 30 天过期）
          - ✅ 勾选 : 产物同时上传到 Release，可直接给他人下载链接
          - ⬜ 不勾 : 只留 Actions Artifacts（30 天后自动清理）
          无论是否勾选，Artifacts 都会上传。
          ⚠️ 即使构建中途失败，只要已有产物，也会自动打包上传
             （见 rescue_release_tag）。
        required: true
        default: true
        type: boolean

      # ============ 复用已有产物（跳过重复编译）============
      # 内核编译动辄 20~30 分钟。如果只是改了打包参数或想重出一份产物，
      # 没必要重编。留空 = 不启用，按正常流程编译。
      reuse_boot_from_run:
        description: |
          【省时间】复用某个历史 Run 已编译好的 boot.img，跳过内核编译
          - 留空        : 正常编译内核（默认）
          - 填 Run ID   : 例如 35342958852
                          会从该 Run 的 Artifacts 里下载 boot.img.gz 直接复用
          ⚠️ 前提是该 Run 确实成功上传过含 boot.img 的 Artifact。
        required: false
        default: ''
        type: string
      artifact_fallback_pattern:
        description: |
          【省时间】按「Artifact 名字通配」自动找最近一次成功的产物复用
          仅当上面的 Run ID 留空时生效，省去手动查 Run ID。
          例如填 xaga-boot-* 会去最近成功的 Run 里找匹配的 Artifact。
          留空 = 不启用。
        required: false
        default: ''
        type: string
      rescue_release_tag:
        description: |
          构建失败时，用哪个 tag 把「已完成的产物」抢救上传到 Release
          - 留空        : 失败时只上传 Actions Artifacts（30 天）
          - 填 tag 名   : 例如 rescue-xaga-boot
                          失败也会把目前已产出的文件打包传到这个 Release
          ⚠️ 失败的产物不保证可用（可能内核编译到一半），
             但至少能让你下载回来排查，不用整个重跑。
        required: false
        default: ''
        type: string

  push:
    tags:
      - 'boot-v*'

permissions:
  contents: write

env:
  # ---- boot.img 头部参数（与 postmarketOS Wiki 一致，改动务必谨慎）----
  KERNEL_BASE: '0x3fff8000'
  KERNEL_OFFSET: '0x8000'
  PAGESIZE: '4096'
  RAMDISK_OFFSET: '0x26f08000'
  TAGS_OFFSET: '0x07c88000'
  DTB_OFFSET: '0x07c88000'
  HEADER_VERSION: '4'
  OS_VERSION: '16.0.0'
  OS_PATCH_LEVEL: '2026-08'
  # ---- 产物压缩 ----
  # pigz 是 gzip 的多线程版，产出的 .gz 全平台（Linux/Windows/macOS、
  # 7-Zip/WinRAR/Bandizip）都能直接解，且解压速度远快于 xz。
  # 超过 2GB 的单个产物会被自动分卷（见 Split large artifacts 步骤）。
  SPLIT_SIZE: '2G'

jobs:
  build:
    name: Build boot.img
    runs-on: ubuntu-24.04
    # 内核编译约 20min，留足余量
    timeout-minutes: 120

    steps:
      # =================================================================
      # 第 0 部分：参数解析
      # =================================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: meta
        run: |
          set -e

          # 压缩步骤（pigz）和后续脚本依赖这几个工具，先统一装好。
          # 注意：必须在下面用 numfmt/bc 之前安装。
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pigz bc coreutils

          for t in pigz bc numfmt split; do
            command -v "$t" >/dev/null 2>&1 \
              && echo "✅ $t 可用" \
              || { echo "::error::缺少 $t"; exit 1; }
          done

          # push tag 时 inputs 全为空，这里统一兜底
          KB="${{ github.event.inputs.kernel_branch }}"
          [ -z "$KB" ] && KB="7.2-mt6895-xiaomi-xaga"

          KR="${{ github.event.inputs.kernel_repo }}"
          [ -z "$KR" ] && KR="https://github.com/MT6895-Mainline/linux.git"

          BP="${{ github.event.inputs.boot_partition }}"
          [ -z "$BP" ] && BP="/dev/sdc86"

          NP="${{ github.event.inputs.nvdata_partition }}"
          [ -z "$NP" ] && NP="/dev/sdc13"

          # ---- 复用已有产物 ----
          RB="${{ github.event.inputs.reuse_boot_from_run }}"
          AP="${{ github.event.inputs.artifact_fallback_pattern }}"

          if [ -n "$RB" ] || [ -n "$AP" ]; then
            REUSE_BOOT="true"
          else
            REUSE_BOOT="false"
          fi

          # ---- 产物名后缀 ----
          # 注意：不能在 `with:` 的表达式里用 failure() / success()，
          # 它们属于 status check function，只在步骤级 `if:` 里可求值。
          # 所以后缀在这里算好、写进 GITHUB_ENV，后面只读 env 值。
          echo "ARTIFACT_SUFFIX=" >> $GITHUB_ENV

          {
            echo "reuse_boot=$REUSE_BOOT"
            echo "reuse_boot_run=$RB"
            echo "fallback_pattern=$AP"
          } >> $GITHUB_OUTPUT

          {
            echo "do_boot=true"
            echo "kernel_branch=$KB"
            echo "kernel_repo=$KR"
            echo "boot_part=$BP"
            echo "nvdata_part=$NP"
          } >> $GITHUB_OUTPUT

          {
            echo "## 📋 本次构建配置"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 内核分支 | \`$KB\` |"
            echo "| 内核仓库 | $KR |"
            echo "| boot 分区 | \`$BP\` |"
            echo "| nvdata 分区 | \`$NP\` |"
            echo "| 产物压缩 | ${{ github.event.inputs.compress_artifacts != 'false' && '✅ gzip (pigz)' || '❌ 原始镜像' }} |"
          } >> $GITHUB_STEP_SUMMARY

          echo "内核分支   : $KB"
          echo "boot 分区  : $BP"
          echo "nvdata 分区: $NP"
          echo "产物压缩   : ${{ github.event.inputs.compress_artifacts != 'false' && 'yes (pigz -9)' || 'no' }}"

      # =================================================================
      # 第 1 部分：编译内核 boot.img
      # =================================================================
      - name: "[boot] Install build dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip cpio gzip lz4 xz-utils \
            device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            zstd rsync \
            mkbootimg android-sdk-libsparse-utils

          # ---- LLVM 工具链 ----
          # 内核用 `make LLVM=1` 编译，需要 clang + lld + llvm 全家桶。
          # ubuntu-24.04 runner 自带 clang（18），但 **不含 ld.lld**：
          #   lld 是独立发行包（Package: lld -> Depends: lld-18），
          #   只装着 clang 时 `ld.lld --version` 会 command not found。
          # llvm-* 那一堆（llvm-ar/nm/objcopy/readelf/strip）由 llvm 包提供，
          # 通常随 clang 一起装上；这里显式列出，避免隐式依赖。
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm

      - name: "[boot] Verify toolchain"
        run: |
          # 显式检查，缺哪个就明确报出来。
          # 不这样做的话，`ld.lld --version` 会以 127 退出，
          # 日志里只有一句 "command not found"，很难定位。
          echo "=== 交叉编译器 (initramfs 用 gcc，内核用 clang/lld) ==="
          MISSING=""
          for t in aarch64-linux-gnu-gcc aarch64-linux-gnu-readelf \
                   clang ld.lld llvm-ar llvm-nm llvm-objcopy \
                   llvm-objdump llvm-readelf llvm-strip \
                   mkbootimg bc bison flex dtc lz4 pigz; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '  ✅ %-26s %s\n' "$t" "$(command -v $t)"
            else
              printf '  ❌ %-26s 缺失\n' "$t"
              MISSING="$MISSING $t"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo ""
            echo "::error::缺少工具:$MISSING"
            echo "提示: ld.lld 在 lld 包里；llvm-* 在 llvm 包里；"
            echo "      aarch64-linux-gnu-* 在 gcc-aarch64-linux-gnu/binasutils 包里"
            exit 1
          fi

          echo ""
          echo "--- 版本 ---"
          aarch64-linux-gnu-gcc --version | head -1
          clang --version | head -1
          ld.lld --version
          echo "nproc: $(nproc --all)"

      - name: "[boot] Set up working mkbootimg"
        run: |
          set -e

          # ============================================================
          # 背景：Ubuntu 的 mkbootimg 包是「上游 AOSP 脚本 + 漏打包依赖」，
          # 直接运行会报：
          #   ModuleNotFoundError: No module named 'gki'
          # 因为 /usr/bin/mkbootimg 第 31 行有模块级 import：
          #   from gki.generate_gki_certificate import generate_gki_certificate
          # 而 gki/ 目录根本没被装进 deb（dpkg -L mkbootimg 可以证实）。
          #
          # 这个 gki 模块只在传 --gki_signing_key 做 GKI 签名时才真正用到，
          # 我们打包的是 header_version=4 的普通 boot.img，不走签名路径，
          # 所以塞一个 stub 让它 import 成功即可。
          #
          # 注意：pip 上没有 mkbootimg 包（PyPI 无此发行），别再走 pip。
          # ============================================================

          WORKDIR="$RUNNER_TEMP/mkbootimg-shim"
          mkdir -p "$WORKDIR/gki"

          : > "$WORKDIR/gki/__init__.py"
          cat > "$WORKDIR/gki/generate_gki_certificate.py" <<'PYEOF'
          """Stub 替代 AOSP 的 gki.generate_gki_certificate。

          真正的实现只在 mkbootimg 收到 --gki_signing_key 时才会被调用。
          我们不做 GKI 签名，这里只需要让模块级 import 成功即可。
          万一真被调用，就明确报错而不是静默产生错误的镜像。
          """


          def generate_gki_certificate(*args, **kwargs):
              raise NotImplementedError(
                  "本环境未提供 GKI 签名实现；本 workflow 不需要 GKI 签名。"
              )
          PYEOF

          # 用 shim 目录优先于系统路径，让 import gki 能解析到
          echo "PYTHONPATH=$WORKDIR" >> $GITHUB_ENV

          echo "=== 验证 mkbootimg 可用 ==="
          export PYTHONPATH="$WORKDIR"
          mkbootimg --help >/dev/null 2>&1 \
            && echo "✅ mkbootimg 可用" \
            || { echo "::error::mkbootimg 仍不可用"; mkbootimg --help; exit 1; }

          echo "mkbootimg 位置: $(command -v mkbootimg)"
          echo "python3        : $(python3 --version)"

          # 记录一下顶层参数，方便后续核对
          echo "=== --help 摘要 ==="
          mkbootimg --help 2>&1 | grep -E "header_version|pagesize|dtb_offset" || true

      - name: "[boot] Smoke-test mkbootimg (self-check)"
        run: |
          set -e
          # 用两个小文件真打一次包，确认能产出合法的 v4 header。
          # 这样如果打包器有问题，在这里就报错，而不是等十几分钟编译完才炸。
          D="$RUNNER_TEMP/mkboot-smoke"
          rm -rf "$D"; mkdir -p "$D"; cd "$D"

          head -c 1048576 /dev/urandom > Image.gz || { echo "::error::无法生成测试 Image"; exit 1; }
          head -c 65536   /dev/urandom > ramdisk.lz4 || { echo "::error::无法生成测试 ramdisk"; exit 1; }

          mkbootimg \
            --kernel Image.gz \
            --ramdisk ramdisk.lz4 \
            --base            "$KERNEL_BASE" \
            --kernel_offset   "$KERNEL_OFFSET" \
            --pagesize        "$PAGESIZE" \
            --ramdisk_offset  "$RAMDISK_OFFSET" \
            --tags_offset     "$TAGS_OFFSET" \
            --dtb_offset      "$DTB_OFFSET" \
            --header_version  "$HEADER_VERSION" \
            --os_version      "$OS_VERSION" \
            --os_patch_level  "$OS_PATCH_LEVEL" \
            -o smoke.img

          python3 - <<'PY'
          import struct, sys
          d = open('smoke.img', 'rb').read(4096)
          assert d[:8] == b'ANDROID!', f'magic 异常: {d[:8]}'
          ksize, rsize, osver, hsize = struct.unpack_from('<4I', d, 8)
          hver = struct.unpack_from('<I', d, 0x28)[0]
          print(f'  kernel_size    : {ksize}')
          print(f'  ramdisk_size   : {rsize}')
          print(f'  header_size    : {hsize}  (v4 应为 1584)')
          print(f'  header_version : {hver}')
          assert hver == 4, f'header_version 应为 4，实际 {hver}'
          assert hsize == 1584, f'header_size 应为 1584，实际 {hsize}'
          print('✅ mkbootimg 冒烟测试通过：可正常产出 boot v4 镜像')
          PY

      # =================================================================
      # 复用已有产物：从历史 Run 的 Artifacts 里把 boot.img 拿回来
      # 启用了复用就不走编译，直接解压还原成 raw .img，后续打包上传流程不变。
      # =================================================================
      - name: "[reuse] Restore boot.img from an earlier run"
        if: steps.meta.outputs.reuse_boot == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p out
          # GitHub runner 自带 gh CLI；unzip 用于解开 Artifact 的 zip 包。
          # 这里显式确认一下，避免跑到一半才发现缺工具。
          for t in gh unzip gunzip; do
            command -v "$t" >/dev/null 2>&1 || { echo "::error::缺少 $t"; exit 1; }
          done

          D="$RUNNER_TEMP/reuse-boot"
          rm -rf "$D"; mkdir -p "$D"

          RID="${{ steps.meta.outputs.reuse_boot_run }}"
          PAT="${{ steps.meta.outputs.fallback_pattern }}"

          # ---- 1. 解析要下载的 artifact ----
          if [ -n "$RID" ]; then
            echo "=== 按 Run ID 复用: $RID ==="
            gh run download "$RID" --dir "$D" -R "${{ github.repository }}"
          elif [ -n "$PAT" ]; then
            echo "=== 按 pattern 复用: $PAT ==="
            # 在当前仓库最近的 Artifacts 里挑最新的匹配项
            AID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
                  --jq "[.artifacts[] | select(.name | test(\"$PAT\")) | select(.expired==false)] | .[0].id")
            if [ -z "$AID" ] || [ "$AID" = "null" ]; then
              echo "::error::未找到匹配 pattern '$PAT' 且未过期的 Artifact"; exit 1
            fi
            echo "匹配到 artifact id=$AID"
            gh api "repos/${{ github.repository }}/actions/artifacts/$AID/zip" > "$D/a.zip"
            (cd "$D" && unzip -q -o a.zip && rm -f a.zip)
          else
            echo "::error::reuse_boot 开启了但没给 Run ID 也没给 pattern"; exit 1
          fi

          echo "=== 下载内容 ==="
          find "$D" -type f | head -50 || true

          # ---- 2. 找到 boot.img 或 boot.img.gz ----
          RAW=$(find "$D" -type f -name 'boot.img' | head -1)
          GZ=$(find "$D" -type f -name 'boot.img.gz' | head -1)
          PART=$(find "$D" -type f -name 'boot.img.gz.part-*' | sort | head -1)

          if [ -n "$RAW" ]; then
            echo "✅ 直接用现成的 boot.img: $RAW"
            cp "$RAW" out/boot.img
          elif [ -n "$GZ" ]; then
            echo "✅ 解压 boot.img.gz: $GZ"
            gunzip -c "$GZ" > out/boot.img
          elif [ -n "$PART" ]; then
            echo "✅ 合并分卷后再解压"
            cat "$(dirname "$PART")"/boot.img.gz.part-* > "$D/merged.gz"
            gunzip -c "$D/merged.gz" > out/boot.img
          else
            echo "::error::下载到的 Artifact 里没有 boot.img / boot.img.gz"
            ls -laR "$D" 2>/dev/null | head -50 || true; exit 1
          fi

          ls -lh out/boot.img || true || true
          file out/boot.img || true

          # ---- 3. 同样做一次 header 校验，确认复用的镜像确实可用 ----
          python3 - <<'PY'
          import struct, sys
          d = open('out/boot.img', 'rb').read(4096)
          if d[:8] != b'ANDROID!':
              print('!! magic 异常:', d[:8]); sys.exit(1)
          ksize = struct.unpack_from('<I', d, 0x08)[0]
          rsize = struct.unpack_from('<I', d, 0x0c)[0]
          hsize = struct.unpack_from('<I', d, 0x14)[0]
          hver  = struct.unpack_from('<I', d, 0x28)[0]
          print(f'  kernel_size    : {ksize}')
          print(f'  ramdisk_size   : {rsize}')
          print(f'  header_size    : {hsize}  (v4 应为 1584)')
          print(f'  header_version : {hver}')
          if hver != 4 or hsize != 1584 or ksize == 0 or rsize == 0:
              print('!! 复用的 boot.img header 不合法'); sys.exit(1)
          print('OK: 复用来的 boot.img 校验通过')
          PY

          echo "REUSED_BOOT=1" >> $GITHUB_ENV
          echo "✅ boot.img 复用成功，已跳过内核编译（省约 20~30 分钟）"

      - name: "[boot] Clone kernel source"
        if: steps.meta.outputs.reuse_boot != 'true'
        run: |
          set -e
          for i in 1 2 3; do
            git clone -b "${{ steps.meta.outputs.kernel_branch }}" --depth 1 \
              "${{ steps.meta.outputs.kernel_repo }}" linux && break
            echo "第 $i 次失败，重试..."; rm -rf linux; sleep 15
          done
          test -d linux || { echo "::error::内核源码拉取失败"; exit 1; }

          cd linux
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "KERNEL_COMMIT_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          git log -1 --format='%H %s'

      - name: "[boot] Merge kernel config"
        if: steps.meta.outputs.reuse_boot != 'true'
        working-directory: linux
        run: |
          set -e
          test -f arch/arm64/configs/defconfig || {
            echo "::error::找不到 arch/arm64/configs/defconfig"; exit 1; }
          test -f arch/arm64/configs/xaga.config || {
            echo "::error::找不到 arch/arm64/configs/xaga.config（分支选错了？）"; exit 1; }

          ARCH=arm64 scripts/kconfig/merge_config.sh \
            arch/arm64/configs/defconfig \
            arch/arm64/configs/xaga.config

          make ARCH=arm64 LLVM=1 olddefconfig

          echo "=== 关键配置 ==="
          grep -E '^CONFIG_(LOCALVERSION|LZ4|RD_LZ4|ARCH_MEDIATEK)=' .config || true

      - name: "[boot] Build kernel Image"
        if: steps.meta.outputs.reuse_boot != 'true'
        working-directory: linux
        run: |
          set -e
          make ARCH=arm64 LLVM=1 -j"$(nproc --all)" Image
          ls -lh arch/arm64/boot/Image || true
          file arch/arm64/boot/Image || true

      - name: "[boot] Build device tree blob"
        if: steps.meta.outputs.reuse_boot != 'true'
        working-directory: linux
        run: |
          set -e
          make ARCH=arm64 LLVM=1 -j"$(nproc --all)" \
            arch/arm64/boot/dts/mediatek/mt6895-xiaomi-xaga.dtb || true

          if [ -f arch/arm64/boot/dts/mediatek/mt6895-xiaomi-xaga.dtb ]; then
            ls -lh arch/arm64/boot/dts/mediatek/mt6895-xiaomi-xaga.dtb || true
          else
            echo "::warning::未生成独立 dtb（DTB 已链入 Image，属正常）"
          fi

      - name: "[boot] Clone initramfs source"
        if: steps.meta.outputs.reuse_boot != 'true'
        run: |
          set -e
          for i in 1 2 3; do
            git clone --depth 1 https://github.com/MT6895-Mainline/initramfs.git && break
            echo "第 $i 次失败，重试..."; rm -rf initramfs; sleep 15
          done
          test -d initramfs || { echo "::error::initramfs 拉取失败"; exit 1; }

          cd initramfs
          echo "INITRAMFS_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "INITRAMFS_COMMIT_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          git log -1 --format='%H %s'

      - name: "[boot] Build initramfs"
        if: steps.meta.outputs.reuse_boot != 'true'
        run: |
          set -e
          BOOT_PART="${{ steps.meta.outputs.boot_part }}"
          NVDATA_PART="${{ steps.meta.outputs.nvdata_part }}"

          cd initramfs
          make clean

          # 上游 Makefile 只注入 BOOT_PARTITION；
          # NVDATA_PARTITION 在 init.c 里是 #ifndef 默认宏（/dev/sdc13）。
          # 用 EXTRA_CFLAGS 追加，不改上游 Makefile。
          sed -i 's|^CFLAGS := |CFLAGS := $(EXTRA_CFLAGS) |' Makefile
          grep -E '^CFLAGS' Makefile

          make \
            CROSS=aarch64-linux-gnu- \
            BOOT_PARTITION="$BOOT_PART" \
            EXTRA_CFLAGS="-DNVDATA_PARTITION=\\\"$NVDATA_PART\\\""

          ls -lh initramfs.cpio.lz4 root/init || true
          aarch64-linux-gnu-readelf -h root/init | grep -E 'Machine|Type'
          echo "=== 确认分区宏已注入 ==="
          strings root/init | grep -E '^/dev/sd' || true

      - name: "[boot] Pack boot.img"
        if: steps.meta.outputs.reuse_boot != 'true'
        run: |
          set -e
          mkdir -p out tmp

          gzip -n -9 -c linux/arch/arm64/boot/Image > tmp/Image.gz
          ls -lh tmp/Image.gz || true

          # header_version 4 不接受 --dtb（DTB 已链入内核镜像）
          mkbootimg \
            --kernel tmp/Image.gz \
            --ramdisk initramfs/initramfs.cpio.lz4 \
            --base            "$KERNEL_BASE" \
            --kernel_offset   "$KERNEL_OFFSET" \
            --pagesize        "$PAGESIZE" \
            --ramdisk_offset  "$RAMDISK_OFFSET" \
            --tags_offset     "$TAGS_OFFSET" \
            --dtb_offset      "$DTB_OFFSET" \
            --header_version  "$HEADER_VERSION" \
            --os_version      "$OS_VERSION" \
            --os_patch_level  "$OS_PATCH_LEVEL" \
            -o out/boot.img

          ls -lh out/boot.img || true

          echo "=== boot.img 头部校验 ==="
          python3 - <<'PY'
          import struct, sys

          # boot_img_hdr 布局（AOSP include/bootimg/bootimg.h）：
          #   0x00  char     magic[8]        "ANDROID!"
          #   0x08  uint32_t kernel_size
          #   0x0c  uint32_t ramdisk_size
          #   0x10  uint32_t os_version
          #   0x14  uint32_t header_size     (v4 = 1584)
          #   0x18  uint32_t reserved[4]     (16 字节)
          #   0x28  uint32_t header_version  ← 注意在 0x28，不在前 7 个 uint32 里
          #
          # 另注：header_version >= 3 时，内核/ramdisk/tags 的加载地址
          # 不再写进 header，而由 bootloader（xaga 上是定制 LK）自行决定。
          # 所以 --base/--kernel_offset 等参数在 v4 下不影响加载地址，
          # 只用于镜像内部页对齐，读不到它们是正常的、不是错误。
          d = open('out/boot.img', 'rb').read(4096)

          magic = d[0x00:0x08]
          if magic != b'ANDROID!':
              print('!! magic 异常:', magic); sys.exit(1)

          ksize = struct.unpack_from('<I', d, 0x08)[0]
          rsize = struct.unpack_from('<I', d, 0x0c)[0]
          osver = struct.unpack_from('<I', d, 0x10)[0]
          hsize = struct.unpack_from('<I', d, 0x14)[0]
          hver  = struct.unpack_from('<I', d, 0x28)[0]

          print(f'magic          : {magic.decode()}')
          print(f'kernel_size    : {ksize} ({ksize/1024/1024:.2f} MB)')
          print(f'ramdisk_size   : {rsize} ({rsize/1024:.1f} KB)')
          print(f'header_size    : {hsize}  (v4 应为 1584)')
          print(f'header_version : {hver}')

          if hver != 4:
              print(f'!! header_version 应为 4，实际 {hver}'); sys.exit(1)
          if hsize != 1584:
              print(f'!! header_size 应为 1584，实际 {hsize}'); sys.exit(1)
          if ksize == 0:
              print('!! kernel 为空'); sys.exit(1)
          if rsize == 0:
              print('!! ramdisk 为空'); sys.exit(1)
          print('OK: boot.img 校验通过')
          PY

      - name: "[boot] Checksum boot.img"
        if: steps.meta.outputs.reuse_boot != 'true'
        run: |
          set -e
          cd out
          sha256sum boot.img | tee boot.img.sha256

      # =================================================================
      # 第 2 部分：汇总产物
      # =================================================================
      - name: "Compress artifacts (pigz)"
        # always() 是关键：前序步骤失败时 GitHub 默认跳过后续步骤，
        # 这里要让「已经编出来的东西」照样压包，所以必须无视失败状态。
        if: |
          always() &&
          github.event.inputs.compress_artifacts != 'false'
        run: |
          set -e
          mkdir -p out
          cd out

          echo "=== 压缩前 ==="
          ls -lh || true
          # 一个产物都没有就别浪费时间了，直接过
          if ! compgen -G 'boot.img' >/dev/null; then
            echo "没有 boot.img 产物可压缩（前面的步骤可能失败了），跳过"
            exit 0
          fi

          BOOT_IMG_GZ_HUMAN="（本次未构建）"

          f=boot.img
          # 把文件名转成合法 env 前缀: boot.img -> BOOT_IMG
          PREFIX=$(echo "${f%.img}" | tr '[:lower:].' '[:upper:]_')

          echo ""
          echo "=== 压缩 $f ==="
          ORIG_BYTES=$(stat -c%s "$f")
          echo "原始大小: $ORIG_BYTES 字节 ($(echo "scale=2; $ORIG_BYTES/1048576" | bc) MB)"

          START=$(date +%s)
          # pigz -9：多线程 gzip，产物 .gz 全平台通用
          # -k 保留原文件（稍后要核对大小，再删）
          pigz -9 -k -f "$f"
          END=$(date +%s)

          NEW_BYTES=$(stat -c%s "$f.gz")
          RATIO=$(echo "scale=2; $ORIG_BYTES/$NEW_BYTES" | bc)
          SAVED=$(echo "scale=1; 100 - ($NEW_BYTES*100/$ORIG_BYTES)" | bc)
          HUMAN=$(numfmt --to=iec "$NEW_BYTES")
          echo "压缩后  : $NEW_BYTES 字节 ($(echo "scale=2; $NEW_BYTES/1048576" | bc) MB)"
          echo "压缩比  : ${RATIO}:1   节省 ${SAVED}%   耗时 $((END-START)) 秒"

          # 校验压缩包完整性 + 生成压缩包的 sha256
          echo "--- 校验压缩包 ---"
          gzip -t "$f.gz" && echo "✅ gzip -t 通过"
          sha256sum "$f.gz" > "$f.gz.sha256"
          cat "$f.gz.sha256"

          # 记下大小，供 Release 正文引用（变量名已转为合法形式）
          {
            echo "${PREFIX}_GZ_BYTES=$NEW_BYTES"
            echo "${PREFIX}_GZ_HUMAN=$HUMAN"
          } >> $GITHUB_ENV

          BOOT_IMG_GZ_HUMAN="$HUMAN"

          # 供 Release 正文使用
          {
            echo "BOOT_IMG_GZ_HUMAN=$BOOT_IMG_GZ_HUMAN"
          } >> $GITHUB_ENV

          # 原始 .img 不再上传（省流量），磁盘上也删掉
          rm -f "$f" "$f.sha256"

          echo ""
          echo "=== 压缩后 ==="
          ls -lh || true

      - name: "Split large artifacts (GitHub 单文件 2GB 上限)"
        if: |
          always() &&
          github.event.inputs.compress_artifacts != 'false'
        run: |
          set -e
          cd out

          # GitHub Release 单个附件硬上限 2GiB；Artifacts 单文件 10GB。
          # 为统一处理，超过 SPLIT_SIZE 就分卷，这样 Release 一定传得上去。
          shopt -s nullglob
          for f in *.gz; do
            SIZE=$(stat -c%s "$f")
            LIMIT=$(numfmt --from=iec "$SPLIT_SIZE")

            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo ""
              echo "=== $f 超过 ${SPLIT_SIZE}，执行分卷 ==="
              echo "大小: $(numfmt --to=iec $SIZE)"
              rm -f "$f".part-*
              split -b "$SPLIT_SIZE" -d -a 2 "$f" "$f.part-"
              ls -lh "$f".part-* || true
              echo "分卷数: $(ls "$f".part-* | wc -l)"

              # 分卷后原 .gz 不再单独上传（否则等于传两遍）
              # 但要留一份整体 sha256 供用户合并后校验
              sha256sum "$f" > "$f.whole-sha256"
              rm -f "$f"
              echo "SPLIT_DONE=1" >> $GITHUB_ENV
            else
              echo "$f 大小 $(numfmt --to=iec $SIZE)，未超过 ${SPLIT_SIZE}，无需分卷"
            fi
          done
          shopt -u nullglob

          echo ""
          echo "=== 最终产物 ==="
          ls -lh || true

      - name: Generate README
        if: always()
        run: |
          set -e
          mkdir -p out
          cd out

          cat > README.txt <<EOF
          ============================================================
           xaga (Redmi Note 11T Pro) boot.img 构建产物
          ============================================================
          构建时间  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Run       : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          --- boot.img 来源 ---
          内核仓库   : ${{ steps.meta.outputs.kernel_repo }}
          内核分支   : ${{ steps.meta.outputs.kernel_branch }}
          内核 commit: ${KERNEL_COMMIT:-(本次未编译内核)}
          initramfs  : ${INITRAMFS_COMMIT:-(本次未编译内核)}

          --- boot.img 参数 ---
          base / kernel_offset : ${KERNEL_BASE} / ${KERNEL_OFFSET}
          pagesize             : ${PAGESIZE}
          ramdisk_offset       : ${RAMDISK_OFFSET}
          tags / dtb offset    : ${TAGS_OFFSET} / ${DTB_OFFSET}
          header_version       : ${HEADER_VERSION}

          --- 分区配置 ---
          BOOT_PARTITION   : ${{ steps.meta.outputs.boot_part }}
          NVDATA_PARTITION : ${{ steps.meta.outputs.nvdata_part }}

          ============================================================
           产物说明
          ============================================================
          本次是否压缩 : ${{ github.event.inputs.compress_artifacts != 'false' && '是（.gz）' || '否（原始 .img）' }}

          压缩包里装的是「原始的 .img 镜像」，解压出来即可直接 fastboot 刷入。
          压缩格式为 gzip（pigz 产出），Linux / Windows / macOS 全平台通用。

          --- 第一步：解压 ---

          Linux / macOS（系统自带 gunzip）:
            gunzip -k boot.img.gz      # -k 保留压缩包，产 boot.img

          也可以一步到位校验+解压:
            sha256sum -c boot.img.gz.sha256

          Windows:
            - 用 7-Zip / WinRAR / Bandizip 右键「解压到当前文件夹」
            - 或 PowerShell（Win10+ 自带 tar，含 gzip 支持）:
                tar -xzf boot.img.gz

          --- 如果产物是分卷的（.part-aa / .part-ab ...）---
          单个压缩包超过 ${SPLIT_SIZE} 时会被切成多卷，先合并再解压：

          Linux / macOS（也适用于 Windows 的 Git Bash / WSL）:
            cat boot.img.gz.part-* > boot.img.gz
            gunzip -k boot.img.gz

          Windows PowerShell:
            cmd /c copy /b boot.img.gz.part-aa+boot.img.gz.part-ab boot.img.gz
            然后参考上面的解压方式

          合并后用 .whole-sha256 校验（注意文件名要改回 .gz）:
            mv boot.img.gz.whole-sha256 boot.img.gz.sha256
            sha256sum -c boot.img.gz.sha256

          ============================================================
           刷入步骤
          ============================================================
          0. 先按上面「第一步：解压」还原出 boot.img
          1. 手机进入 fastboot：关机后按住 电源 + 音量减
          2. fastboot --set-active=a
          3. fastboot flash boot boot.img
          4. fastboot reboot

          注意：本产物只含内核 + initramfs，不含根文件系统。
          userdata 分区需要你自己刷入合适的 rootfs 镜像。

          --- 校验 ---
          校验的是「下载到的压缩包」，解压前执行：
            sha256sum -c boot.img.gz.sha256
          未开启压缩时，校验文件名为 boot.img.sha256。

          --- 回滚 ---
          fastboot flash boot <备份的 stock-boot.img>
          fastboot --set-active=b
          ============================================================
          EOF

          echo "=== 产物列表 ==="
          ls -lh || true
          echo ""
          cat README.txt

      - name: Mark artifacts as partial if incomplete
        # 必须在 with: 之外算——failure() 不能在 with: 表达式里用。
        # 这里看实际产物判断，比看 job.status 更准。
        if: always()
        run: |
          # 用 compgen -G 判断有无产物。
          # 不要写 `ARTS=(out/boot.img)` 这种不含 glob 元字符的路径：
          # bash 不对它做展开，nullglob 也不起作用，数组里永远是字面量，
          # 会把「无产物」误判成「完整」。（out/boot.img* 带 * 才安全）
          has() { compgen -G "$1" >/dev/null; }

          if ! has 'out/boot.img*'; then
            echo "ARTIFACT_SUFFIX=-partial" >> $GITHUB_ENV
            echo "::warning::产物不完整（缺 boot.img），Artifact 名加 -partial 后缀"
          else
            echo "ARTIFACT_SUFFIX=" >> $GITHUB_ENV
            echo "产物完整"
          fi

      - name: Upload boot artifacts
        # 失败也要上传：先把编出来的东西保住，别让几十分钟白费
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 后缀由前面的步骤算好写进 GITHUB_ENV（-partial 表示产物不完整）
          name: xaga-boot-${{ env.KERNEL_COMMIT_SHORT || 'noboot' }}${{ env.ARTIFACT_SUFFIX }}
          # 产物要么是 .img（未压缩），要么是 .gz / .gz.part-*（已压缩）。
          # 用 glob 通吃两种情况，避免 if-no-files-found 误报。
          path: |
            out/*.gz
            out/*.gz.sha256
            out/*.gz.part-*
            out/*.whole-sha256
            out/*.img
            out/*.img.sha256
            out/README.txt
          retention-days: 30
          # 失败场景下可能确实一个产物都没有，这时不该报 error 掩盖真实错误
          if-no-files-found: warn
          compression-level: 0

      # =================================================================
      # 第 3 部分：发布 Release
      # =================================================================
      - name: Compute release tag
        if: |
          always() && (
            (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
            github.event.inputs.create_release == 'true' ||
            github.event.inputs.rescue_release_tag != ''
          )
        id: tag
        run: |
          set -e
          # 判断本次是不是「抢救包」：只要产物缺了本该有的那一份，就算不完整。
          # 注意：不要用 ${{ job.status }}，它在 run: 脚本里不可靠
          # （官方只保证它在 if: 表达式里可用）。这里改成看实际产物。

          has() { compgen -G "$1" >/dev/null; }

          NOTHING=false
          if ! has 'out/*.gz' && ! has 'out/*.img'; then
            NOTHING=true
          fi

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            OUT_TAG="${{ github.ref_name }}"
          elif [ "$NOTHING" = "true" ]; then
            # 一个文件都没有，Release 传上去也是空的，直接跳过
            OUT_TAG=""
            echo "::warning::本次没有任何产物，跳过 Release"
          elif ! has 'out/boot.img*' && [ -n "${{ github.event.inputs.rescue_release_tag }}" ]; then
            # 产物不完整 + 用户配了抢救 tag → 走抢救通道，不污染正式产物
            OUT_TAG="${{ github.event.inputs.rescue_release_tag }}"
            echo "IS_RESCUE=true" >> $GITHUB_ENV
            echo "::warning::产物不完整（缺 boot.img），按抢救模式发布到 tag '$OUT_TAG'"
          elif ! has 'out/boot.img*'; then
            # 产物不完整且没配抢救 tag → 不上传 Release，只留 Artifacts
            OUT_TAG=""
            echo "::warning::产物不完整（缺 boot.img），且未设置 rescue_release_tag，跳过 Release"
          else
            OUT_TAG="xaga-boot-${KERNEL_COMMIT_SHORT:-noboot}"
          fi
          echo "out_tag=$OUT_TAG" >> $GITHUB_OUTPUT
          echo "release tag = ${OUT_TAG:-（跳过）}"

      - name: Create or update Release
        # 成功照常发布；失败时若配了 rescue tag，也把残件抢救上去。
        # out_tag 为空表示「产物不完整且没配抢救 tag」，这时直接跳过。
        if: |
          always() &&
          steps.tag.outputs.out_tag != '' && (
            (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
            github.event.inputs.create_release == 'true' ||
            env.IS_RESCUE == 'true'
          )
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.out_tag }}
          name: ${{ steps.tag.outputs.out_tag }}
          body: |
            ## xaga (Redmi Note 11T Pro) boot.img 构建产物

            ${{ env.IS_RESCUE == 'true' && '> ⚠️ **这是构建失败后的「抢救包」**：只包含失败前已经产出的文件，不保证完整可用，仅用于排查或复用。' || '' }}

            ${{ env.REUSED_BOOT == '1' && '> ♻️ boot.img 复用自历史 Run，未重新编译内核。' || '' }}

            ### 构建参数

            | 项目 | 值 |
            |---|---|
            | 内核分支 | `${{ steps.meta.outputs.kernel_branch }}` |
            | 内核 commit | `${{ env.KERNEL_COMMIT_SHORT || '（本次未编译内核）' }}` |
            | initramfs commit | `${{ env.INITRAMFS_COMMIT_SHORT || '（本次未编译内核）' }}` |
            | boot 分区 | `${{ steps.meta.outputs.boot_part }}` |
            | nvdata 分区 | `${{ steps.meta.outputs.nvdata_part }}` |
            | 产物压缩 | ${{ github.event.inputs.compress_artifacts != 'false' && '✅ gzip 压缩' || '❌ 原始镜像' }} |
            | boot.img 压缩后 | `${{ env.BOOT_IMG_GZ_HUMAN || '（本次未构建）' }}` |

            ### 🔻 第一步：解压产物

            上传的是**压缩后**的镜像，刷机前必须先解压：

            ```bash
            # 单文件（大多数情况）
            gunzip -k boot.img.gz

            # 如果看到 .part-aa / .part-ab 这样的分卷，先合并再解压
            cat boot.img.gz.part-* > boot.img.gz
            gunzip -k boot.img.gz
