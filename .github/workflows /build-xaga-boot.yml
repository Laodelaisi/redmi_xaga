name: Build xaga boot.img

# 红米 Note 11T Pro (xaga) 主线内核 + initramfs + boot.img 一键构建
#
# 触发方式：
#   1. 手动触发（Actions 页面 "Run workflow" 按钮）
#   2. push tag（如 v1.0）
#
# 产物：
#   - GitHub Actions Artifacts（保留 90 天）
#   - GitHub Release 永久资源（需要打 tag 或勾选 release 选项）

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: '内核分支'
        required: true
        default: '7.2-mt6895-xiaomi-xaga'
        type: choice
        options:
          - '7.2-mt6895-xiaomi-xaga'
          - '6.18-mt6895-xiaomi-xaga'
      kernel_repo:
        description: '内核仓库地址'
        required: true
        default: 'https://github.com/MT6895-Mainline/linux.git'
        type: string
      boot_partition:
        description: 'boot/rootfs 分区设备路径（默认 /dev/sdc86 = userdata）'
        required: true
        default: '/dev/sdc86'
        type: string
      nvdata_partition:
        description: 'nvdata 分区设备路径（默认 /dev/sdc13）'
        required: true
        default: '/dev/sdc13'
        type: string
      create_release:
        description: '生成 GitHub Release（永久资源）'
        required: true
        default: true
        type: boolean
      reuse_boot_from_run:
        description: |
          【省时间】复用某个历史 Run 已编译好的 boot.img，跳过内核编译
          留空 = 正常编译；填 Run ID（如 35342958852）= 从该 Run 的 Artifacts 下载复用。
          内核没改动、只想重出一份产物时，能省 20~30 分钟。
        required: false
        default: ''
        type: string
      rescue_release_tag:
        description: |
          构建失败时，用哪个 tag 把「已产出的产物」抢救上传到 Release
          留空 = 失败时只留 Actions Artifacts；填 tag 名 = 失败也上传。
        required: false
        default: ''
        type: string

  push:
    tags:
      - 'v*'
      - '!rootfs-*'
    branches:
      - main
      - master

# Release 需要写权限
permissions:
  contents: write

env:
  # 与 postmarketOS Wiki 记录的一致，改这里要慎重
  KERNEL_BASE: '0x3fff8000'
  KERNEL_OFFSET: '0x8000'
  PAGESIZE: '4096'
  RAMDISK_OFFSET: '0x26f08000'
  TAGS_OFFSET: '0x07c88000'
  DTB_OFFSET: '0x07c88000'
  HEADER_VERSION: '4'
  OS_VERSION: '16.0.0'
  OS_PATCH_LEVEL: '2026-08'

jobs:
  build:
    name: Build kernel + initramfs + boot.img
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # ---------------------------------------------------------------
      # 1. 环境准备
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip cpio gzip lz4 xz-utils \
            device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            zstd rsync

          # ---- mkbootimg ----
          # 注意两个坑：
          #  1. android-sdk-libsparse-utils **只提供** img2simg/simg2img 等，
          #     不含 mkbootimg。Ubuntu 里 mkbootimg 是独立包。
          #  2. PyPI 上 **没有** mkbootimg 这个发行包，
          #     `pip3 install mkbootimg` 必然报 "No matching distribution"。
          #     所以绝不能写 pip 兜底，只能从 apt 装。
          sudo apt-get install -y --no-install-recommends \
            mkbootimg android-sdk-libsparse-utils

          # ---- LLVM 工具链 ----
          # 内核用 `make LLVM=1` 编译，需要 clang + lld + llvm 全家桶。
          # ubuntu-24.04 runner 自带 clang（18），但 **不含 ld.lld**：
          #   lld 是独立发行包（Package: lld -> Depends: lld-18），
          #   只装着 clang 时 `ld.lld --version` 会 command not found。
          # llvm-* 那一堆（llvm-ar/nm/objcopy/readelf/strip）由 llvm 包提供，
          # 通常随 clang 一起装上；这里显式列出，避免隐式依赖。
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm

      - name: Resolve build metadata
        id: meta
        run: |
          set -e
          BRANCH="${{ github.event.inputs.kernel_branch }}"
          [ -z "$BRANCH" ] && BRANCH="7.2-mt6895-xiaomi-xaga"

          REPO="${{ github.event.inputs.kernel_repo }}"
          [ -z "$REPO" ] && REPO="https://github.com/MT6895-Mainline/linux.git"

          BOOT_PART="${{ github.event.inputs.boot_partition }}"
          [ -z "$BOOT_PART" ] && BOOT_PART="/dev/sdc86"

          NVDATA_PART="${{ github.event.inputs.nvdata_partition }}"
          [ -z "$NVDATA_PART" ] && NVDATA_PART="/dev/sdc13"

          {
            echo "branch=$BRANCH"
            echo "kernel_repo=$REPO"
            echo "boot_part=$BOOT_PART"
            echo "nvdata_part=$NVDATA_PART"
          } >> $GITHUB_OUTPUT

          echo "branch    = $BRANCH"
          echo "repo      = $REPO"
          echo "boot_part = $BOOT_PART"
          echo "nvdata    = $NVDATA_PART"

      - name: "Set up working mkbootimg"
        run: |
          set -e

          # ============================================================
          # 背景：Ubuntu 的 mkbootimg 包是「上游 AOSP 脚本 + 漏打包依赖」，
          # 直接运行会报：
          #   ModuleNotFoundError: No module named 'gki'
          # 因为 /usr/bin/mkbootimg 第 31 行有模块级 import：
          #   from gki.generate_gki_certificate import generate_gki_certificate
          # 而 gki/ 目录根本没被装进 deb（dpkg -L mkbootimg 可以证实）。
          #
          # 这个 gki 模块只在传 --gki_signing_key 做 GKI 签名时才真正用到，
          # 我们打包的是 header_version=4 的普通 boot.img，不走签名路径，
          # 所以塞一个 stub 让它 import 成功即可。
          # ============================================================
          WORKDIR="$RUNNER_TEMP/mkbootimg-shim"
          mkdir -p "$WORKDIR/gki"

          : > "$WORKDIR/gki/__init__.py"
          cat > "$WORKDIR/gki/generate_gki_certificate.py" <<'PYEOF'
          """Stub 替代 AOSP 的 gki.generate_gki_certificate。

          真正的实现只在 mkbootimg 收到 --gki_signing_key 时才会被调用。
          我们不做 GKI 签名，这里只需要让模块级 import 成功即可。
          万一真被调用，就明确报错而不是静默产生错误的镜像。
          """


          def generate_gki_certificate(*args, **kwargs):
              raise NotImplementedError(
                  "本环境未提供 GKI 签名实现；本 workflow 不需要 GKI 签名。"
              )
          PYEOF

          echo "PYTHONPATH=$WORKDIR" >> $GITHUB_ENV

          echo "=== 验证 mkbootimg 可用 ==="
          export PYTHONPATH="$WORKDIR"
          mkbootimg --help >/dev/null 2>&1 \
            && echo "✅ mkbootimg 可用" \
            || { echo "::error::mkbootimg 仍不可用"; mkbootimg --help; exit 1; }

          echo "mkbootimg 位置: $(command -v mkbootimg)"

      - name: Smoke-test mkbootimg (self-check)
        run: |
          set -e
          # 用两个小文件真打一次包，确认能产出合法的 v4 header。
          # 这样如果打包器有问题，在这里就报错，而不是等十几分钟编译完才炸。
          D="$RUNNER_TEMP/mkboot-smoke"
          rm -rf "$D"; mkdir -p "$D"; cd "$D"

          head -c 1048576 /dev/urandom > Image.gz || { echo "::error::无法生成测试 Image"; exit 1; }
          head -c 65536   /dev/urandom > ramdisk.lz4 || { echo "::error::无法生成测试 ramdisk"; exit 1; }

          mkbootimg \
            --kernel Image.gz \
            --ramdisk ramdisk.lz4 \
            --base            "$KERNEL_BASE" \
            --kernel_offset   "$KERNEL_OFFSET" \
            --pagesize        "$PAGESIZE" \
            --ramdisk_offset  "$RAMDISK_OFFSET" \
            --tags_offset     "$TAGS_OFFSET" \
            --dtb_offset      "$DTB_OFFSET" \
            --header_version  "$HEADER_VERSION" \
            --os_version      "$OS_VERSION" \
            --os_patch_level  "$OS_PATCH_LEVEL" \
            -o smoke.img

          python3 - <<'PY'
          import struct
          d = open('smoke.img', 'rb').read(4096)
          assert d[:8] == b'ANDROID!', f'magic 异常: {d[:8]}'
          ksize, rsize, osver, hsize = struct.unpack_from('<4I', d, 8)
          hver = struct.unpack_from('<I', d, 0x28)[0]
          print(f'  kernel_size    : {ksize}')
          print(f'  ramdisk_size   : {rsize}')
          print(f'  header_size    : {hsize}  (v4 应为 1584)')
          print(f'  header_version : {hver}')
          assert hver == 4, f'header_version 应为 4，实际 {hver}'
          assert hsize == 1584, f'header_size 应为 1584，实际 {hsize}'
          print('✅ mkbootimg 冒烟测试通过：可正常产出 boot v4 镜像')
          PY

      - name: Verify toolchain
        run: |
          # 显式检查，缺哪个就明确报出来。
          # 不这样做的话，`ld.lld --version` 会以 127 退出，
          # 日志里只有一句 "command not found"，很难定位。
          MISSING=""
          for t in aarch64-linux-gnu-gcc aarch64-linux-gnu-readelf \
                   clang ld.lld llvm-ar llvm-nm llvm-objcopy \
                   llvm-objdump llvm-readelf llvm-strip \
                   mkbootimg bc bison flex dtc lz4; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '  ✅ %-26s %s\n' "$t" "$(command -v $t)"
            else
              printf '  ❌ %-26s 缺失\n' "$t"
              MISSING="$MISSING $t"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo ""
            echo "::error::缺少工具:$MISSING"
            echo "提示: ld.lld 在 lld 包里；llvm-* 在 llvm 包里；"
            echo "      aarch64-linux-gnu-* 在 gcc-aarch64-linux-gnu/binutils 包里"
            exit 1
          fi

          echo ""
          echo "--- 版本 ---"
          aarch64-linux-gnu-gcc --version | head -1
          clang --version | head -1
          ld.lld --version
          echo "nproc: $(nproc --all)"

      # ---------------------------------------------------------------
      # 1.5 复用已有产物（填了 reuse_boot_from_run 就跳过内核编译）
      # ---------------------------------------------------------------
      - name: Restore boot.img from an earlier run
        if: github.event.inputs.reuse_boot_from_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p out
          for t in gh unzip gunzip; do
            command -v "$t" >/dev/null 2>&1 || { echo "::error::缺少 $t"; exit 1; }
          done

          D="$RUNNER_TEMP/reuse-boot"
          rm -rf "$D"; mkdir -p "$D"

          RID="${{ github.event.inputs.reuse_boot_from_run }}"
          echo "=== 从 Run $RID 下载 Artifacts ==="
          gh run download "$RID" --dir "$D" -R "${{ github.repository }}" \
            || { echo "::error::Run $RID 下载失败（ID 对吗？Artifact 过期了吗？）"; exit 1; }

          find "$D" -type f | head -50 || true

          RAW=$(find "$D" -type f -name 'boot.img' | head -1)
          GZ=$(find "$D" -type f -name 'boot.img.gz' | head -1)

          if [ -n "$RAW" ]; then
            echo "✅ 用现成的 boot.img"; cp "$RAW" out/boot.img
          elif [ -n "$GZ" ]; then
            echo "✅ 解压 boot.img.gz"; gunzip -c "$GZ" > out/boot.img
          else
            echo "::error::该 Run 的 Artifact 里没有 boot.img / boot.img.gz"; exit 1
          fi

          ls -lh out/boot.img || true
          # 复用也要验一遍 header，确认拿到的确实是可用的 v4 镜像
          python3 - <<'PY'
          import struct, sys
          d = open('out/boot.img','rb').read(4096)
          if d[:8] != b'ANDROID!':
              print('!! magic 异常:', d[:8]); sys.exit(1)
          k = struct.unpack_from('<I', d, 0x08)[0]
          r = struct.unpack_from('<I', d, 0x0c)[0]
          hs = struct.unpack_from('<I', d, 0x14)[0]
          hv = struct.unpack_from('<I', d, 0x28)[0]
          print(f'  kernel_size={k} ramdisk_size={r} header_size={hs} header_version={hv}')
          if hv != 4 or hs != 1584 or k == 0 or r == 0:
              print('!! 复用的 boot.img header 不合法'); sys.exit(1)
          print('OK: 复用来的 boot.img 校验通过')
          PY
          echo "REUSED_BOOT=1" >> $GITHUB_ENV

      # ---------------------------------------------------------------
      # 2. 拉取内核源码（B1）
      # ---------------------------------------------------------------
      - name: Clone kernel source
        if: github.event.inputs.reuse_boot_from_run == ''
        run: |
          BRANCH="${{ github.event.inputs.kernel_branch }}"
          if [ -z "$BRANCH" ]; then
            # 触发方式是 push tag 时的默认分支
            BRANCH="7.2-mt6895-xiaomi-xaga"
          fi
          REPO="${{ github.event.inputs.kernel_repo }}"
          if [ -z "$REPO" ]; then
            REPO="https://github.com/MT6895-Mainline/linux.git"
          fi

          echo "BRANCH=$BRANCH"
          echo "REPO=$REPO"

          # 内核仓库很大，用 --depth 1 只拉最新提交
          # 失败则重试（GitHub 偶发网络抖动）
          for i in 1 2 3; do
            git clone -b "$BRANCH" --depth 1 "$REPO" linux && break
            echo "clone 失败，第 $i 次重试..."
            rm -rf linux
            sleep 10
          done

          test -d linux || { echo "::error::内核源码拉取失败"; exit 1; }

          cd linux
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "KERNEL_COMMIT_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          git log -1 --format='%H %s'

      # ---------------------------------------------------------------
      # 3. 配置内核（B2 / B3）
      # ---------------------------------------------------------------
      - name: Merge kernel config
        if: github.event.inputs.reuse_boot_from_run == ''
        working-directory: linux
        run: |
          set -e
          test -f arch/arm64/configs/defconfig || {
            echo "::error::找不到 arch/arm64/configs/defconfig"; exit 1; }
          test -f arch/arm64/configs/xaga.config || {
            echo "::error::找不到 arch/arm64/configs/xaga.config（分支选错了？）"; exit 1; }

          ARCH=arm64 scripts/kconfig/merge_config.sh \
            arch/arm64/configs/defconfig \
            arch/arm64/configs/xaga.config

          # olddefconfig 自动补全新增符号
          make ARCH=arm64 LLVM=1 olddefconfig

          echo "=== 关键配置校验 ==="
          grep -E '^CONFIG_(LOCALVERSION|LZ4|RD_LZ4|ARCH_MEDIATEK|ARM64)=' .config || true

      # ---------------------------------------------------------------
      # 4. 编译内核（B4）
      # ---------------------------------------------------------------
      - name: Build kernel Image
        if: github.event.inputs.reuse_boot_from_run == ''
        working-directory: linux
        run: |
          set -e
          # LLVM=1 使用 clang/lld（runner 上已装 clang 18）
          make ARCH=arm64 LLVM=1 -j"$(nproc --all)" Image

          echo "=== 编译产物 ==="
          ls -lh arch/arm64/boot/Image || true
          file arch/arm64/boot/Image || true

      - name: Build device tree blob
        if: github.event.inputs.reuse_boot_from_run == ''
        working-directory: linux
        run: |
          set -e
          # mt6895-xiaomi-xaga.dtb 在 Makefile 里是 always-y，理论上随 Image 一起生成
          # 但这里显式再编一次，确保存在
          make ARCH=arm64 LLVM=1 -j"$(nproc --all)" \
            arch/arm64/boot/dts/mediatek/mt6895-xiaomi-xaga.dtb || true

          if [ -f arch/arm64/boot/dts/mediatek/mt6895-xiaomi-xaga.dtb ]; then
            ls -lh arch/arm64/boot/dts/mediatek/mt6895-xiaomi-xaga.dtb || true
            echo "DTB_FOUND=true" >> $GITHUB_ENV
          else
            echo "::warning::未生成独立 dtb 文件（DTB 已链入 Image，属正常）"
            echo "DTB_FOUND=false" >> $GITHUB_ENV
          fi

      # ---------------------------------------------------------------
      # 5. 编译 initramfs（B5 / B6）
      # ---------------------------------------------------------------
      - name: Clone initramfs source
        if: github.event.inputs.reuse_boot_from_run == ''
        run: |
          set -e
          for i in 1 2 3; do
            git clone --depth 1 https://github.com/MT6895-Mainline/initramfs.git \
              && break
            echo "clone 失败，第 $i 次重试..."
            rm -rf initramfs
            sleep 10
          done
          test -d initramfs || { echo "::error::initramfs 拉取失败"; exit 1; }

          cd initramfs
          echo "INITRAMFS_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "INITRAMFS_COMMIT_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          git log -1 --format='%H %s'

      - name: Build initramfs
        if: github.event.inputs.reuse_boot_from_run == ''
        run: |
          set -e
          BOOT_PART="${{ github.event.inputs.boot_partition }}"
          NVDATA_PART="${{ github.event.inputs.nvdata_partition }}"
          [ -z "$BOOT_PART" ]   && BOOT_PART="/dev/sdc86"
          [ -z "$NVDATA_PART" ] && NVDATA_PART="/dev/sdc13"

          echo "BOOT_PARTITION   = $BOOT_PART"
          echo "NVDATA_PARTITION = $NVDATA_PART"

          cd initramfs
          make clean

          # 注意：上游 Makefile 的 CFLAGS 只注入 BOOT_PARTITION，
          # NVDATA_PARTITION 在 init.c 里是 #ifndef 保护的默认宏（/dev/sdc13）。
          # 这里用 EXTRA_CFLAGS 追加 -D NVDATA_PARTITION，不动原 Makefile。
          sed -i 's|^CFLAGS := |CFLAGS := $(EXTRA_CFLAGS) |' Makefile
          grep -E '^CFLAGS' Makefile

          make \
            CROSS=aarch64-linux-gnu- \
            BOOT_PARTITION="$BOOT_PART" \
            EXTRA_CFLAGS="-DNVDATA_PARTITION=\\\"$NVDATA_PART\\\""

          echo "=== initramfs 产物 ==="
          ls -lh initramfs.cpio.lz4 || true
          ls -lh root/init || true
          file root/init || true
          # 确认是 aarch64 静态二进制
          aarch64-linux-gnu-readelf -h root/init | grep -E 'Machine|Type'
          # 确认分区路径已按参数注入
          echo "=== 确认分区宏已注入 ==="
          strings root/init | grep -E '^/dev/sd' || true

      # ---------------------------------------------------------------
      # 6. 打包 boot.img（C1 / C2）
      # ---------------------------------------------------------------
      - name: Pack boot.img
        if: github.event.inputs.reuse_boot_from_run == ''
        run: |
          set -e
          mkdir -p out tmp

          # C1: 压缩内核
          gzip -n -9 -c linux/arch/arm64/boot/Image > tmp/Image.gz
          ls -lh tmp/Image.gz || true

          # C2: 打包
          # 注意：
          #   - header_version 4 不接受 --dtb（DTB 已链入内核镜像）
          #   - 所有偏移量必须与 postmarketOS Wiki 一致
          mkbootimg \
            --kernel tmp/Image.gz \
            --ramdisk initramfs/initramfs.cpio.lz4 \
            --base            "$KERNEL_BASE" \
            --kernel_offset   "$KERNEL_OFFSET" \
            --pagesize        "$PAGESIZE" \
            --ramdisk_offset  "$RAMDISK_OFFSET" \
            --tags_offset     "$TAGS_OFFSET" \
            --dtb_offset      "$DTB_OFFSET" \
            --header_version  "$HEADER_VERSION" \
            --os_version      "$OS_VERSION" \
            --os_patch_level  "$OS_PATCH_LEVEL" \
            -o out/boot.img

          echo "=== boot.img ==="
          ls -lh out/boot.img || true

          # 自检：解包回读，确认头部参数正确
          echo "=== boot.img 头信息校验 ==="
          python3 - <<'PY'
          import struct, sys

          with open('out/boot.img','rb') as f:
              d = f.read(4096)

          magic = d[:8]
          print('magic          :', magic)
          if magic not in (b'ANDROID!',):
              print('!! magic 异常，boot.img 可能无效')
              sys.exit(1)

          # boot_img_hdr 布局（AOSP include/bootimg/bootimg.h）：
          #   0x00  char     magic[8]        "ANDROID!"
          #   0x08  uint32_t kernel_size
          #   0x0c  uint32_t ramdisk_size
          #   0x10  uint32_t os_version
          #   0x14  uint32_t header_size     (v4 = 1584)
          #   0x18  uint32_t reserved[4]     (16 字节)
          #   0x28  uint32_t header_version  ← 在 0x28，不在前 7 个 uint32 里
          #
          # 踩过的坑：早先写成 '<7I' 一次性解包，把 reserved3 当成了
          # header_version，读出来永远是 0，会把正常镜像误判为失败。
          kernel_size = struct.unpack_from('<I', d, 0x08)[0]
          ramdisk_size = struct.unpack_from('<I', d, 0x0c)[0]
          os_version = struct.unpack_from('<I', d, 0x10)[0]
          header_size = struct.unpack_from('<I', d, 0x14)[0]
          header_version = struct.unpack_from('<I', d, 0x28)[0]

          print(f'kernel_size    : {kernel_size} ({kernel_size/1024/1024:.2f} MB)')
          print(f'ramdisk_size   : {ramdisk_size} ({ramdisk_size/1024:.1f} KB)')
          print(f'os_version     : 0x{os_version:08x}')
          print(f'header_size    : {header_size}  (v4 应为 1584)')
          print(f'header_version : {header_version}')

          if header_version != 4:
              print('!! header_version 不是 4')
              sys.exit(1)
          if header_size != 1584:
              print(f'!! header_size 应为 1584，实际 {header_size}')
              sys.exit(1)
          if kernel_size == 0:
              print('!! kernel 为空')
              sys.exit(1)
          if ramdisk_size == 0:
              print('!! ramdisk 为空')
              sys.exit(1)

          print('OK: boot.img 头部校验通过')
          PY

      # ---------------------------------------------------------------
      # 7. 生成校验和与构建信息（便于事后核对 / 救砖排查）
      # ---------------------------------------------------------------
      - name: Generate checksums and build info
        run: |
          set -e
          cd out
          sha256sum boot.img > boot.img.sha256

          cat > build-info.txt <<EOF
          ============================================================
           xaga (Redmi Note 11T Pro) boot.img 构建信息
          ============================================================
          构建时间        : $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          GitHub Run      : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GitHub Commit   : ${{ github.sha }}

          --- 源码 ---
          内核仓库        : ${{ steps.meta.outputs.kernel_repo }}
          内核分支        : ${{ steps.meta.outputs.branch }}
          内核 commit     : ${KERNEL_COMMIT}
          initramfs commit: ${INITRAMFS_COMMIT}

          --- boot.img 参数 ---
          base            : ${KERNEL_BASE}
          kernel_offset   : ${KERNEL_OFFSET}
          pagesize        : ${PAGESIZE}
          ramdisk_offset  : ${RAMDISK_OFFSET}
          tags_offset     : ${TAGS_OFFSET}
          dtb_offset      : ${DTB_OFFSET}
          header_version  : ${HEADER_VERSION}
          os_version      : ${OS_VERSION}
          os_patch_level  : ${OS_PATCH_LEVEL}

          --- 分区配置 ---
          BOOT_PARTITION  : ${{ steps.meta.outputs.boot_part }}
          NVDATA_PARTITION: ${{ steps.meta.outputs.nvdata_part }}

          --- 文件校验 ---
          $(cat boot.img.sha256)

          --- 刷入方法 ---
          1. 手机进入 fastboot：关机后按住 电源 + 音量减
          2. fastboot --set-active=a
          3. fastboot flash boot boot.img
          4. fastboot flash userdata <你的 rootfs.img>
          5. fastboot reboot

          --- 回滚 ---
          fastboot flash boot <备份的 stock-boot.img>
          fastboot --set-active=b
          ============================================================
          EOF

          echo "=== 产物列表 ==="
          ls -lh || true
          echo ""
          cat build-info.txt

      # ---------------------------------------------------------------
      # 7.5 压缩产物（失败也要压，别让已编出来的东西白费）
      # ---------------------------------------------------------------
      - name: Compress boot.img (pigz)
        if: always()
        run: |
          set -e
          cd out
          if [ ! -f boot.img ]; then
            echo "没有 boot.img 可压缩（前面的步骤可能失败了），跳过"
            exit 0
          fi
          ORIG=$(stat -c%s boot.img)
          pigz -9 -k -f boot.img
          NEW=$(stat -c%s boot.img.gz)
          echo "原始: $ORIG 字节 → 压缩后: $NEW 字节 ($(numfmt --to=iec $NEW))"
          gzip -t boot.img.gz && echo "✅ gzip -t 通过"
          sha256sum boot.img.gz > boot.img.gz.sha256
          cat boot.img.gz.sha256
          rm -f boot.img boot.img.sha256
          ls -lh || true

      - name: Mark artifact as partial if incomplete
        # 必须在 with: 之外算——failure() 是 status check function，
        # 只在步骤级 if: 里可求值，写进 with: 会报 Unrecognized function。
        if: always()
        run: |
          # 注意：不能用 `ARTS=(out/boot.img out/boot.img.gz)` 这种写法来判断，
          # 因为这两项**不含 glob 元字符**，bash 根本不会做路径展开，
          # nullglob 也救不了 —— 数组里永远是 2 个字面字符串，
          # 于是「什么都没产出」会被误判成「产物完整」。
          # 用 compgen -G（真正的 glob 匹配，无匹配返回空）才靠谱。
          n=0
          for pat in 'out/boot.img' 'out/boot.img.gz'; do
            if compgen -G "$pat" >/dev/null; then
              n=$((n + 1))
              echo "  找到: $(ls $pat)"
            fi
          done

          if [ "$n" -gt 0 ]; then
            echo "ARTIFACT_SUFFIX=" >> $GITHUB_ENV
            echo "产物完整"
          else
            echo "ARTIFACT_SUFFIX=-partial" >> $GITHUB_ENV
            echo "::warning::没有产出 boot.img，Artifact 名加 -partial 后缀"
          fi

      # ---------------------------------------------------------------
      # 8. 上传 Artifacts（90 天）
      # ---------------------------------------------------------------
      - name: Upload boot.img as artifact
        # 失败也上传：保住已产出的部分，方便排查或复用
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xaga-boot-img-${{ env.KERNEL_COMMIT_SHORT || 'noboot' }}${{ env.ARTIFACT_SUFFIX }}
          path: |
            out/boot.img
            out/boot.img.gz
            out/boot.img.sha256
            out/boot.img.gz.sha256
            out/build-info.txt
          retention-days: 90
          # 失败场景下可能确实没产物，不该用 error 掩盖真实错误
          if-no-files-found: warn

      - name: Upload raw kernel Image (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: xaga-kernel-image-${{ env.KERNEL_COMMIT_SHORT }}
          path: |
            linux/arch/arm64/boot/Image
            tmp/Image.gz
          retention-days: 14
          if-no-files-found: warn

      - name: Upload initramfs (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: xaga-initramfs-${{ env.KERNEL_COMMIT_SHORT }}
          path: |
            initramfs/initramfs.cpio.lz4
            initramfs/root/init
          retention-days: 14
          if-no-files-found: warn

      # ---------------------------------------------------------------
      # 9. 发布到 Release（永久资源）
      # ---------------------------------------------------------------
      - name: Compute release tag
        if: |
          always() && (
            (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
            github.event.inputs.create_release == 'true' ||
            github.event.inputs.rescue_release_tag != ''
          )
        id: tag
        run: |
          set -e
          # 看实际产物判断是否完整（不要用 ${{ job.status }}，run: 里不可靠）
          # 用 compgen -G 而非数组字面量：不含 glob 元字符的路径 bash 不做展开。
          has_art=false
          for pat in 'out/boot.img' 'out/boot.img.gz'; do
            compgen -G "$pat" >/dev/null && has_art=true
          done

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            OUT_TAG="${{ github.ref_name }}"
          elif [ "$has_art" = "false" ]; then
            OUT_TAG=""
            echo "::warning::没有产出 boot.img，跳过 Release"
          elif [ -n "${{ github.event.inputs.rescue_release_tag }}" ]; then
            OUT_TAG="${{ github.event.inputs.rescue_release_tag }}"
            echo "IS_RESCUE=true" >> $GITHUB_ENV
            echo "::warning::按抢救模式发布到 tag '$OUT_TAG'"
          else
            OUT_TAG="xaga-${KERNEL_COMMIT_SHORT:-noboot}"
          fi
          echo "out_tag=$OUT_TAG" >> $GITHUB_OUTPUT
          echo "release tag = ${OUT_TAG:-（跳过）}"

      - name: Create or update Release
        if: |
          always() &&
          steps.tag.outputs.out_tag != '' && (
            (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
            github.event.inputs.create_release == 'true' ||
            env.IS_RESCUE == 'true'
          )
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.out_tag }}
          name: ${{ steps.tag.outputs.out_tag }}
          body: |
            ## xaga (Redmi Note 11T Pro) boot.img

            ${{ env.IS_RESCUE == 'true' && '> ⚠️ **这是构建失败后的「抢救包」**：不保证可用，仅用于排查或复用已编译产物。' || '' }}

            由 GitHub Actions 自动构建。

            | 项目 | 值 |
            |---|---|
            | 内核分支 | `${{ steps.meta.outputs.branch }}` |
            | 内核 commit | `${{ env.KERNEL_COMMIT_SHORT || '未知' }}` |
            | initramfs commit | `${{ env.INITRAMFS_COMMIT_SHORT || '未知' }}` |
            | BOOT_PARTITION | `${{ steps.meta.outputs.boot_part }}` |
            | NVDATA_PARTITION | `${{ steps.meta.outputs.nvdata_part }}` |

            ### 第一步：解压

            上传的是 gzip 压缩后的镜像：

            ```bash
            gunzip -k boot.img.gz     # 得到 boot.img
            ```

            Windows 用 7-Zip / WinRAR 右键解压，或 PowerShell：`tar -xzf boot.img.gz`

            ### 刷入

            ```bash
            # 进入 fastboot：关机后按住 电源 + 音量减
            fastboot --set-active=a
            fastboot flash boot boot.img
            fastboot flash userdata rootfs.img
            fastboot reboot
            ```

            ### 校验（解压前执行）

            ```bash
            sha256sum -c boot.img.gz.sha256
            ```

            ### 回滚

            ```bash
            fastboot flash boot <stock-boot.img>
            fastboot --set-active=b
            ```

            > 详见附件 `build-info.txt`。

            ### 注意事项

            - 本 boot.img 假定你的 `userdata` 是 `${{ steps.meta.outputs.boot_part }}`、`nvdata` 是 `${{ steps.meta.outputs.nvdata_part }}`。
              如果与你的设备不符，请用 workflow 里对应输入项重新构建。
            - 首次刷入前务必刷新工程版 preloader，确保能自行救砖。
          files: |
            out/boot.img
            out/boot.img.gz
            out/boot.img.sha256
            out/boot.img.gz.sha256
            out/build-info.txt
          draft: false
          prerelease: false
          # 压缩模式下没有 .img，未压缩时没有 .gz，不强制匹配
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------
      # 10. 汇总
      # ---------------------------------------------------------------
      - name: Summary
        run: |
          {
            echo "## ✅ 构建成功"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 内核 commit | \`${KERNEL_COMMIT_SHORT}\` |"
            echo "| initramfs commit | \`${INITRAMFS_COMMIT}\` |"
            echo "| boot.img 大小 | $(du -h out/boot.img | cut -f1) |"
            echo "| sha256 | \`$(cut -d' ' -f1 out/boot.img.sha256)\` |"
            echo ""
            echo "### 产物"
            echo "- Actions Artifacts（90 天）: \`xaga-boot-img-${KERNEL_COMMIT_SHORT}\`"
            if [ -n "${{ steps.tag.outputs.out_tag }}" ]; then
              echo "- Release 永久资源 tag: \`${{ steps.tag.outputs.out_tag }}\`"
            fi
          } >> $GITHUB_STEP_SUMMARY
